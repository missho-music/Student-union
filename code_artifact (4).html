    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 這是你的 Firebase 專案設定
        const firebaseConfig = {
            apiKey: "AIzaSyD-3OsCFOxKwRvMOYSwtdtHQtu5hevyDQE",
            authDomain: "school-admin-8cc4f.firebaseapp.com",
            projectId: "school-admin-8cc4f",
            storageBucket: "school-admin-8cc4f.firebasestorage.app",
            messagingSenderId: "906512650902",
            appId: "1:906512650902:web:f51018de2fb88f7042e8b7",
            measurementId: "G-D4XSFMPRRK"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            // 綁定到全域變數，供下方的 Vanilla JS 使用
            window.firebaseDb = db;
            window.firebaseFns = { collection, doc, setDoc, onSnapshot };

            console.log("Firebase Firestore 連線成功！");
            initCloudSync();
        } catch (err) {
            console.error("Firebase 初始化失敗，切換至本地儲存：", err);
            initLocalStorageFallback();
        }
    </script>

</head>

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>

                <button onclick="saveMembers()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl transition font-semibold flex items-center gap-2 shadow-md shadow-blue-200">儲存名單</button>
            </div>
        </div>

    <script>
        const DEFAULT_MEMBERS = Array.from({ length: 16 }, (_, i) => `成員 ${i + 1}`);
        const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        
        let state = {
            currentTerm: 1,
            currentView: 'daily',
            members: DEFAULT_MEMBERS,
            records: {},
            isCloudReady: false
        };

        function initCloudSync() {
            const db = window.firebaseDb;
            const { doc, collection, onSnapshot, setDoc } = window.firebaseFns;

            document.getElementById('cloud-status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            document.getElementById('cloud-status-text').innerText = "雲端即時同步中";
            document.getElementById('storage-mode-hint').innerText = "資料已安全儲存於 Firebase 雲端資料庫。";
            state.isCloudReady = true;

            const settingsRef = doc(db, 'school_admin_settings', 'rosterConfig');
            onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().members) {
                    state.members = docSnap.data().members;
                } else {
                    setDoc(settingsRef, { members: DEFAULT_MEMBERS }, { merge: true });
                }
                render();
            }, (err) => {
                console.warn("Firestore 讀取失敗，切換本地：", err);
                initLocalStorageFallback();
            });

            const recordsCol = collection(db, 'school_admin_records');
            onSnapshot(recordsCol, (snapshot) => {
                const newRecords = {};
                snapshot.forEach(docSnap => {
                    newRecords[docSnap.id] = docSnap.data();
                });
                state.records = newRecords;
                render();
            });
        }

        function initLocalStorageFallback() {
            document.getElementById('cloud-status-dot').className = "w-2 h-2 rounded-full bg-blue-500";
            document.getElementById('cloud-status-text').innerText = "離線/本地模式";
            document.getElementById('storage-mode-hint').innerText = "因權限或連線問題，資料目前儲存於瀏覽器內。";
            state.members = JSON.parse(localStorage.getItem('su_members')) || DEFAULT_MEMBERS;
            state.records = JSON.parse(localStorage.getItem('su_records')) || {};
            render();
        }

        function generateTermDates(term) {
            let start, end;
            if (term === 1) {
                // 第一學期：2026年10月12日到11月2日
                start = new Date('2026-10-12');
                end = new Date('2026-11-02');
            } else if (term === 2) {
                // 第二學期：2026年11月23日到2027年2月22日
                start = new Date('2026-11-23');
                end = new Date('2027-02-22');
            } else {
                // 第三學期：2027年3月15日到6月3日
                start = new Date('2027-03-15');
                end = new Date('2027-06-03');
            }

            const dates = [];
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                const day = d.getDay();
                if (day === 0 || day === 6) continue; // 排除週末

                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}-${mm}-${dd}`;

                // 排除長假、公眾假期與停課日
                const holidays = [
                    '2026-10-19', '2026-10-24', '2026-12-22', '2026-12-23', '2026-12-24', '2026-12-25', '2026-12-28', '2026-12-29', '2026-12-30', '2026-12-31', '2027-01-01',
                    '2027-02-03', '2027-02-04', '2027-02-05', '2027-02-08', '2027-02-09', '2027-02-10', '2027-02-11', '2027-02-12', '2027-04-05'
                ];
                if (holidays.includes(dateStr)) continue;

                dates.push({ date: dateStr, term: term, dayOfWeek: WEEKDAYS[day] });
            }
            return dates;
        }

        async function saveData(dateStr, recordData) {
            if (state.isCloudReady) {
                try {
                    const db = window.firebaseDb;
                    const { doc, setDoc } = window.firebaseFns;
                    const recordRef = doc(db, 'school_admin_records', dateStr);
                    // 【重要】這裡使用 { merge: true }，代表只會「更新」該日期的檔案，不會無限產生新檔案。
                    await setDoc(recordRef, recordData, { merge: true });
                } catch (err) {
                    console.error("雲端儲存失敗", err);
                }
            } else {
                state.records[dateStr] = recordData;
                localStorage.setItem('su_records', JSON.stringify(state.records));
                render();
            }
        }

        async function saveMembersToCloud() {
            if (state.isCloudReady) {
                try {
                    const db = window.firebaseDb;
                    const { doc, setDoc } = window.firebaseFns;
                    const settingsRef = doc(db, 'school_admin_settings', 'rosterConfig');
                    await setDoc(settingsRef, { members: state.members }, { merge: true });
                } catch (err) {
                    console.error("儲存成員失敗", err);
                }
            } else {
                localStorage.setItem('su_members', JSON.stringify(state.members));
                render();
            }
        }

        function switchTerm(term) {
            state.currentTerm = term;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`term-btn-${i}`);
                if (i === term) {
                    btn.className = "flex-1 sm:px-6 py-2.5 text-xs md:text-sm font-bold rounded-lg transition-all bg-blue-600 text-white shadow-sm";
                } else {
                    btn.className = "flex-1 sm:px-6 py-2.5 text-xs md:text-sm font-bold rounded-lg transition-all text-slate-600 hover:bg-white hover:text-blue-700";
                }
            }
            const desc = term === 1 ? "第 1 學期 (10/12-11/2)" : (term === 2 ? "第 2 學期 (11/23-2/22)" : "第 3 學期 (3/15-6/3)");
            document.getElementById('view-main-title').innerHTML = `
                <span class="p-2.5 bg-blue-100 text-blue-600 rounded-2xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </span>
                ${desc} 排班表`;
            render();
        }

        function switchView(view) {
            state.currentView = view;
            const dailyBtn = document.getElementById('view-btn-daily');
            const matrixBtn = document.getElementById('view-btn-matrix');
            const dailyContainer = document.getElementById('daily-view-container');
            const matrixContainer = document.getElementById('matrix-view-container');

            if (view === 'daily') {
                dailyBtn.className = "flex-1 sm:px-6 py-2.5 text-xs md:text-sm font-bold rounded-lg transition-all bg-white text-blue-700 shadow-sm";
                matrixBtn.className = "flex-1 sm:px-6 py-2.5 text-xs md:text-sm font-bold rounded-lg transition-all text-slate-600 hover:bg-white hover:text-blue-700";
                dailyContainer.classList.remove('hidden');
                matrixContainer.classList.add('hidden');
            } else {
                matrixBtn.className = "flex-1 sm:px-6 py-2.5 text-xs md:text-sm font-bold rounded-lg transition-all bg-white text-blue-700 shadow-sm";
                dailyBtn.className = "flex-1 sm:px-6 py-2.5 text-xs md:text-sm font-bold rounded-lg transition-all text-slate-600 hover:bg-white hover:text-blue-700";
                matrixContainer.classList.remove('hidden');
                dailyContainer.classList.add('hidden');
            }
            render();
        }

        function render() {
            const termDates = generateTermDates(state.currentTerm);
            document.getElementById('date-count-badge').innerText = `共 ${termDates.length} 個上課日`;

            if (state.currentView === 'daily') {
                renderDailyView(termDates);
            } else {
                renderMatrixView(termDates);
            }

            renderStats(termDates);
        }

        function renderDailyView(termDates) {
            const container = document.getElementById('daily-view-container');
            container.innerHTML = '';

            termDates.forEach(item => {
                const dateStr = item.date;
                const dayOfWeek = item.dayOfWeek;
                if (!state.records[dateStr]) {
                    state.records[dateStr] = { lunch: ["", ""], afterSchool: ["", ""], remarks: [] };
                }
                const rec = state.records[dateStr];

                const card = document.createElement('div');
                card.className = 'border border-blue-100 rounded-3xl bg-white shadow-sm hover:shadow-md transition-all overflow-hidden';
                
                let memberOptions = '<option value="">-- 選擇成員 --</option>';
                state.members.forEach(m => { memberOptions += `<option value="${m}">${m}</option>`; });

                let remarksHtml = '';
                if (rec.remarks && rec.remarks.length > 0) {
                    rec.remarks.forEach(rem => {
                        remarksHtml += `
                            <div class="flex justify-between items-center bg-rose-50/70 p-3.5 rounded-xl border border-rose-100 text-sm">
                                <div class="flex items-center gap-3">
                                    <span class="font-bold text-rose-950">${rem.member}</span>
                                    <span class="text-rose-600 font-bold bg-white px-2 py-0.5 rounded-md text-xs shadow-sm">-${rem.hours}h</span>
                                    <span class="text-slate-500 text-xs border-l border-rose-200 pl-3">${rem.reason || "無原因"}</span>
                                </div>
                                <button onclick="deleteRemark('${dateStr}', '${rem.id}')" class="text-slate-400 hover:text-rose-600 font-bold px-1.5 text-lg transition">&times;</button>
                            </div>
                        `;
                    });
                }

                card.innerHTML = `
                    <div class="bg-blue-50/50 px-6 py-4 border-b border-blue-100 flex justify-between items-center">
                        <h3 class="font-extrabold text-blue-950 text-base md:text-lg flex items-center gap-2.5">
                            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            ${dateStr} <span class="text-sm font-bold px-2.5 py-0.5 bg-white text-blue-700 rounded-lg shadow-sm border border-blue-100">${dayOfWeek}</span>
                        </h3>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-3 bg-blue-50/40 p-5 rounded-2xl border border-blue-100/80">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-bold text-blue-900 text-xs md:text-sm">午膳當值 (1:05-1:30)</span>
                                <span class="text-xs font-bold text-blue-600 bg-white px-2 py-1 rounded-md shadow-sm">0.5 小時</span>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <select onchange="updateAssignee('${dateStr}', 'lunch', 0, this.value)" class="w-full border border-blue-200 rounded-xl p-3 text-sm font-medium text-blue-950 bg-white hover:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none transition cursor-pointer">
                                    ${memberOptions.replace(`value="${rec.lunch?.[0]}"`, `value="${rec.lunch?.[0]}" selected`)}
                                </select>
                                <select onchange="updateAssignee('${dateStr}', 'lunch', 1, this.value)" class="w-full border border-blue-200 rounded-xl p-3 text-sm font-medium text-blue-950 bg-white hover:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none transition cursor-pointer">
                                    ${memberOptions.replace(`value="${rec.lunch?.[1]}"`, `value="${rec.lunch?.[1]}" selected`)}
                                </select>
                            </div>
                        </div>

                        <div class="space-y-3 bg-sky-50/40 p-5 rounded-2xl border border-sky-100/80">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-bold text-sky-900 text-xs md:text-sm">放學當值 (4:05-5:00)</span>
                                <span class="text-xs font-bold text-sky-600 bg-white px-2 py-1 rounded-md shadow-sm">1.0 小時</span>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <select onchange="updateAssignee('${dateStr}', 'afterSchool', 0, this.value)" class="w-full border border-sky-200 rounded-xl p-3 text-sm font-medium text-sky-950 bg-white hover:border-sky-400 focus:ring-2 focus:ring-sky-200 outline-none transition cursor-pointer">
                                    ${memberOptions.replace(`value="${rec.afterSchool?.[0]}"`, `value="${rec.afterSchool?.[0]}" selected`)}
                                </select>
                                <select onchange="updateAssignee('${dateStr}', 'afterSchool', 1, this.value)" class="w-full border border-sky-200 rounded-xl p-3 text-sm font-medium text-sky-950 bg-white hover:border-sky-400 focus:ring-2 focus:ring-sky-200 outline-none transition cursor-pointer">
                                    ${memberOptions.replace(`value="${rec.afterSchool?.[1]}"`, `value="${rec.afterSchool?.[1]}" selected`)}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-50/50 p-5 space-y-3 rounded-b-3xl border-t border-slate-100">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">缺席與扣時紀錄 (Remark)</h4>
                            <button onclick="toggleRemarkForm('${dateStr}')" class="text-xs text-blue-600 hover:text-blue-800 font-bold bg-white px-4 py-2 rounded-xl transition border border-blue-200 shadow-sm">+ 新增扣時</button>
                        </div>
                        ${remarksHtml ? `<div class="space-y-2.5 mt-2">${remarksHtml}</div>` : ''}
                        
                        <div id="remark-form-${dateStr}" class="hidden bg-white p-5 rounded-2xl border border-blue-100 shadow-sm flex flex-wrap gap-4 items-end mt-3">
                            <div class="flex-1 min-w-[120px]">
                                <label class="block text-xs text-slate-400 mb-1.5 font-bold">成員</label>
                                <select id="remark-member-${dateStr}" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm font-medium text-slate-700 bg-slate-50">${memberOptions}</select>
                            </div>
                            <div class="w-24">
                                <label class="block text-xs text-slate-400 mb-1.5 font-bold">扣除(h)</label>
                                <input type="number" id="remark-hours-${dateStr}" step="0.5" min="0.5" value="0.5" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm font-medium text-slate-700 bg-slate-50">
                            </div>
                            <div class="flex-[2] min-w-[150px]">
                                <label class="block text-xs text-slate-400 mb-1.5 font-bold">原因 (選填)</label>
                                <input type="text" id="remark-reason-${dateStr}" placeholder="例如：病假" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm font-medium text-slate-700 bg-slate-50">
                            </div>
                            <button onclick="addRemark('${dateStr}')" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-sm">確認扣時</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderMatrixView(termDates) {
            const container = document.getElementById('matrix-view-container');
            
            let tableHtml = `
                <div class="overflow-x-auto rounded-2xl border border-blue-100 shadow-sm">
                    <table class="w-full text-sm text-left border-collapse bg-white">
                        <thead>
                            <tr class="bg-blue-50/80 text-blue-900 font-bold border-b border-blue-100">
                                <th class="p-4 border-r border-blue-100 min-w-[170px]">日期</th>
                                <th class="p-4 border-r border-blue-100 min-w-[160px]">午膳當值 (1)</th>
                                <th class="p-4 border-r border-blue-100 min-w-[160px]">午膳當值 (2)</th>
                                <th class="p-4 border-r border-blue-100 min-w-[160px]">放學當值 (1)</th>
                                <th class="p-4 min-w-[160px]">放學當值 (2)</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
            `;

            termDates.forEach(item => {
                const dateStr = item.date;
                const dayOfWeek = item.dayOfWeek;
                const rec = state.records[dateStr] || { lunch: ["", ""], afterSchool: ["", ""] };

                const formatCell = (val) => val ? `<span class="bg-blue-100/60 text-blue-900 font-bold px-3 py-1.5 rounded-lg border border-blue-200/50">${val}</span>` : '<span class="text-slate-300">-</span>';

                tableHtml += `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="p-4 font-bold text-slate-700 border-r border-slate-100 whitespace-nowrap bg-slate-50/30">
                            ${dateStr} <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md ml-1.5 border border-blue-100/50">${dayOfWeek}</span>
                        </td>
                        <td class="p-4 border-r border-slate-100">${formatCell(rec.lunch?.[0])}</td>
                        <td class="p-4 border-r border-slate-100">${formatCell(rec.lunch?.[1])}</td>
                        <td class="p-4 border-r border-slate-100">${formatCell(rec.afterSchool?.[0])}</td>
                        <td class="p-4">${formatCell(rec.afterSchool?.[1])}</td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table></div>`;
            container.innerHTML = tableHtml;
        }

        function renderStats(termDates) {
            const stats = {};
            state.members.forEach(m => { stats[m] = { totalHrs: 0, deductionHrs: 0 }; });

            const termDateStrs = termDates.map(i => i.date);

            Object.keys(state.records).forEach(dateStr => {
                if (!termDateStrs.includes(dateStr)) return;
                const rec = state.records[dateStr];

                if (rec.lunch) rec.lunch.forEach(m => { if (stats[m]) stats[m].totalHrs += 0.5; });
                if (rec.afterSchool) rec.afterSchool.forEach(m => { if (stats[m]) stats[m].totalHrs += 1.0; });
                
                if (rec.remarks) {
                    rec.remarks.forEach(rem => {
                        if (stats[rem.member]) {
                            stats[rem.member].deductionHrs += Number(rem.hours || 0);
                            stats[rem.member].totalHrs -= Number(rem.hours || 0);
                        }
                    });
                }
            });

            const tbody = document.getElementById('stats-table-body');
            tbody.innerHTML = '';

            state.members.forEach(m => {
                const s = stats[m];
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition';
                tr.innerHTML = `
                    <td class="px-4 py-3.5 font-bold text-blue-950">${m}</td>
                    <td class="px-4 py-3.5 text-center">
                        <span class="px-3 py-1.5 rounded-full text-xs font-bold ${s.totalHrs > 0 ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-400'}">
                            ${s.totalHrs.toFixed(1)} h
                        </span>
                    </td>
                    <td class="px-4 py-3.5 text-right text-rose-500 font-bold">${s.deductionHrs > 0 ? `-${s.deductionHrs}h` : '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateAssignee(dateStr, type, index, value) {
            if (!state.records[dateStr]) {
                state.records[dateStr] = { lunch: ["", ""], afterSchool: ["", ""], remarks: [] };
            }
            state.records[dateStr][type][index] = value;
            saveData(dateStr, state.records[dateStr]);
        }

        function toggleRemarkForm(dateStr) {
            const form = document.getElementById(`remark-form-${dateStr}`);
            form.classList.toggle('hidden');
        }

        function addRemark(dateStr) {
            const member = document.getElementById(`remark-member-${dateStr}`).value;
            const hours = document.getElementById(`remark-hours-${dateStr}`).value;
            const reason = document.getElementById(`remark-reason-${dateStr}`).value;
            if (!member) return;

            if (!state.records[dateStr]) state.records[dateStr] = { lunch: ["", ""], afterSchool: ["", ""], remarks: [] };
            if (!state.records[dateStr].remarks) state.records[dateStr].remarks = [];
            
            state.records[dateStr].remarks.push({
                id: Date.now().toString(),
                member: member,
                hours: Number(hours),
                reason: reason
            });
            saveData(dateStr, state.records[dateStr]);
        }

        function deleteRemark(dateStr, remarkId) {
            if (state.records[dateStr] && state.records[dateStr].remarks) {
                state.records[dateStr].remarks = state.records[dateStr].remarks.filter(r => r.id !== remarkId);
                saveData(dateStr, state.records[dateStr]);
            }
        }

        function openMembersModal() {
            const container = document.getElementById('members-inputs-container');
            container.innerHTML = '';
            state.members.forEach((m, idx) => {
                container.innerHTML += `
                    <div class="flex items-center gap-3">
                        <span class="text-blue-400 w-6 text-right text-sm font-bold">${idx + 1}.</span>
                        <input type="text" id="member-input-${idx}" value="${m}" class="flex-1 border border-blue-200 rounded-xl px-4 py-3 text-sm font-medium text-blue-950 bg-blue-50/30 focus:bg-white focus:border-blue-400 focus:ring-2 focus:ring-blue-200 outline-none transition">
                    </div>
                `;
            });
            document.getElementById('members-modal').classList.remove('hidden');
        }

        function closeMembersModal() {
            document.getElementById('members-modal').classList.add('hidden');
        }

        function saveMembers() {
            const newMembers = [];
            for (let i = 0; i < 16; i++) {
                const val = document.getElementById(`member-input-${i}`).value.trim();
                newMembers.push(val || `成員 ${i + 1}`);
            }
            state.members = newMembers;
            closeMembersModal();
            saveMembersToCloud();
        }

        window.onload = function() {
            setTimeout(() => {
                if (!state.isCloudReady) initLocalStorageFallback();
            }, 2000);
        };
    </script>
</body>
</html>
