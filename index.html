    <script>
        // 16 位預設成員名單
        const DEFAULT_MEMBERS = Array.from({ length: 16 }, (_, i) => `成員 ${i + 1}`);
        const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        
        // 全域狀態定義 (同時掛載至 window 避免切換與調用錯誤)
        window.state = {
            currentTerm: 1,
            currentView: 'daily',
            members: DEFAULT_MEMBERS,
            records: {},
            isCloudReady: false
        };

        const state = window.state;

        function initCloudSync() {
            const db = window.firebaseDb;
            const { doc, collection, onSnapshot, setDoc } = window.firebaseFns;

            document.getElementById('cloud-status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
            document.getElementById('cloud-status-text').innerText = "雲端同步中";
            state.isCloudReady = true;

            // 1. 讀取與監聽成員名單設定
            const settingsRef = doc(db, 'school_admin_settings', 'rosterConfig');
            onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists() && Array.isArray(docSnap.data().members)) {
                    state.members = docSnap.data().members.map(m => String(m).trim());
                    // 確保名單長度充足
                    while (state.members.length < 16) {
                        state.members.push(`成員 ${state.members.length + 1}`);
                    }
                } else {
                    setDoc(settingsRef, { members: DEFAULT_MEMBERS }, { merge: true }).catch(console.warn);
                }
                render();
            }, (err) => {
                console.warn("Firestore 設定讀取失敗：", err);
                initLocalStorageFallback();
            });

            // 2. 讀取與監聽排班紀錄
            const recordsCol = collection(db, 'school_admin_records');
            onSnapshot(recordsCol, (snapshot) => {
                const newRecords = {};
                snapshot.forEach(docSnap => {
                    newRecords[docSnap.id] = docSnap.data();
                });
                
                state.records = { ...state.records, ...newRecords };
                render();
            }, (err) => {
                console.warn("Firestore 紀錄讀取失敗，降級至本地：", err);
                initLocalStorageFallback();
            });
        }

        function initLocalStorageFallback() {
            state.isCloudReady = false;
            const dot = document.getElementById('cloud-status-dot');
            const txt = document.getElementById('cloud-status-text');
            if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
            if (txt) txt.innerText = "離線 / 本地模式";

            try {
                const localMembers = JSON.parse(localStorage.getItem('su_members'));
                if (Array.isArray(localMembers) && localMembers.length >= 1) {
                    state.members = localMembers.map(m => String(m).trim());
                }
                const localRecords = JSON.parse(localStorage.getItem('su_records'));
                if (localRecords && typeof localRecords === 'object') {
                    state.records = localRecords;
                }
            } catch(e) {
                console.error("Local Storage Read Error:", e);
            }
            render();
        }

        // 安全無時區偏差之日期生成邏輯
        function generateTermDates(term) {
            let start, end;
            if (term === 1) {
                // 第一學期：2026-10-12 到 2026-11-02
                start = new Date(2026, 9, 12); // 注意：月從0開始，9為10月
                end = new Date(2026, 10, 2);   // 10為11月
            } else if (term === 2) {
                // 第二學期：2026-11-23 到 2027-02-22
                start = new Date(2026, 10, 23);
                end = new Date(2027, 1, 22);
            } else {
                // 第三學期：2027-03-15 到 2027-06-03
                start = new Date(2027, 2, 15);
                end = new Date(2027, 5, 3);
            }

            const dates = [];
            const cur = new Date(start.getTime());

            while (cur <= end) {
                const day = cur.getDay();
                if (day !== 0 && day !== 6) { // 排除週末
                    const yyyy = cur.getFullYear();
                    const mm = String(cur.getMonth() + 1).padStart(2, '0');
                    const dd = String(cur.getDate()).padStart(2, '0');
                    const dateStr = `${yyyy}-${mm}-${dd}`;

                    // 特殊假期排除清單
                    const holidays = [
                        '2026-10-19', '2026-10-24', '2026-12-22', '2026-12-23', '2026-12-24', 
                        '2026-12-25', '2026-12-28', '2026-12-29', '2026-12-30', '2026-12-31', 
                        '2027-01-01', '2027-02-03', '2027-02-04', '2027-02-05', '2027-02-08', 
                        '2027-02-09', '2027-02-10', '2027-02-11', '2027-02-12', '2027-04-05'
                    ];

                    if (!holidays.includes(dateStr)) {
                        dates.push({ date: dateStr, term: term, dayOfWeek: WEEKDAYS[day] });
                    }
                }
                cur.setDate(cur.getDate() + 1); // 逐日遞增
            }
            return dates;
        }

        async function saveData(dateStr, recordData) {
            // 1. 樂觀更新 (Optimistic UI Update)
            state.records[dateStr] = JSON.parse(JSON.stringify(recordData));
            try {
                localStorage.setItem('su_records', JSON.stringify(state.records));
            } catch(e){}
            
            // 2. 立即重算右側統計
            const termDates = generateTermDates(state.currentTerm);
            renderStats(termDates);

            // 3. 背景非同步推送到 Firebase
            if (state.isCloudReady) {
                try {
                    const db = window.firebaseDb;
                    const { doc, setDoc } = window.firebaseFns;
                    const recordRef = doc(db, 'school_admin_records', dateStr);
                    await setDoc(recordRef, recordData, { merge: true });
                } catch (err) {
                    console.warn("雲端同步失敗：", err);
                }
            }
        }

        async function saveMembersToCloud() {
            try {
                localStorage.setItem('su_members', JSON.stringify(state.members));
            } catch(e){}

            if (state.isCloudReady) {

        // 右側統計 calculation (含午膳/放學次數與嚴格淨時數)
        function renderStats(termDates) {
            const stats = {};
            
            state.members.forEach(m => { 
                const cleanName = String(m).trim();
                if (cleanName) {
                    stats[cleanName] = { lunchCount: 0, afterSchoolCount: 0, totalHrs: 0, deductionHrs: 0 };
                }
            });

            const termDateStrs = termDates.map(i => i.date);

            Object.keys(state.records).forEach(dateStr => {
                if (!termDateStrs.includes(dateStr)) return;
                const rec = state.records[dateStr];

                if (rec.lunch && Array.isArray(rec.lunch)) {
                    rec.lunch.forEach(m => { 
                        const cleanM = String(m || '').trim();
                        if (cleanM && stats[cleanM]) {
                            stats[cleanM].lunchCount += 1;
                            stats[cleanM].totalHrs += 0.5;
                        }
                    });
                }
                
                if (rec.afterSchool && Array.isArray(rec.afterSchool)) {
                    rec.afterSchool.forEach(m => { 
                        const cleanM = String(m || '').trim();
                        if (cleanM && stats[cleanM]) {
                            stats[cleanM].afterSchoolCount += 1;
                            stats[cleanM].totalHrs += 1.0;
                        }
                    });
                }
                
                if (rec.remarks && Array.isArray(rec.remarks)) {
                    rec.remarks.forEach(rem => {
                        const cleanM = String(rem.member || '').trim();
                        if (cleanM && stats[cleanM]) {
                            const hrs = Number(rem.hours || 0);
                            stats[cleanM].deductionHrs += hrs;
                            stats[cleanM].totalHrs -= hrs;
                        }
                    });
                }
            });

            // 轉陣列並依淨時數排序
            const sortedMembers = Object.keys(stats).map(name => ({
                name,
                ...stats[name]
            })).sort((a, b) => b.totalHrs - a.totalHrs);

            const tbody = document.getElementById('stats-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            sortedMembers.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition border-b border-slate-100 last:border-0';
                
                // 前三名徽章
                let rankBadge = `<span class="text-slate-400 text-xs w-4 inline-block font-mono">${index + 1}.</span>`;
                if (index === 0) rankBadge = `<span class="text-amber-500 font-bold text-xs w-4 inline-block">🥇</span>`;
                if (index === 1) rankBadge = `<span class="text-slate-400 font-bold text-xs w-4 inline-block">🥈</span>`;
                if (index === 2) rankBadge = `<span class="text-amber-700 font-bold text-xs w-4 inline-block">🥉</span>`;

                tr.innerHTML = `
                    <td class="px-3 py-2.5 font-bold text-slate-800 text-xs md:text-sm flex items-center gap-1 truncate">
                        ${rankBadge} ${item.name}
                    </td>
                    <td class="px-2 py-2.5 text-center text-xs text-slate-500">
                        <span class="text-blue-600 font-semibold">${item.lunchCount}</span> / <span class="text-indigo-600 font-semibold">${item.afterSchoolCount}</span>
                    </td>
                    <td class="px-2 py-2.5 text-center text-xs text-rose-500 font-bold">
                        ${item.deductionHrs > 0 ? `-${item.deductionHrs}h` : '-'}
                    </td>
                    <td class="px-3 py-2.5 text-right">
                        <span class="px-2.5 py-1 rounded-full text-xs font-extrabold shadow-2xs border ${item.totalHrs > 0 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-400 border-slate-200'}">
                            ${item.totalHrs.toFixed(1)} h
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.updateAssignee = function(dateStr, type, index, value) {
            const cleanVal = String(value || '').trim();
            
            if (!state.records[dateStr]) {
                state.records[dateStr] = { lunch: ["", ""], afterSchool: ["", ""], remarks: [] };
            }
            if (!state.records[dateStr][type] || !Array.isArray(state.records[dateStr][type])) {
                state.records[dateStr][type] = ["", ""];
            }

            state.records[dateStr][type][index] = cleanVal;
            saveData(dateStr, state.records[dateStr]);
        }

        window.toggleRemarkForm = function(dateStr) {
            const form = document.getElementById(`remark-form-${dateStr}`);
            if (form) form.classList.toggle('hidden');
        }

        window.addRemark = function(dateStr) {
            const memberEl = document.getElementById(`remark-member-${dateStr}`);
            const hoursEl = document.getElementById(`remark-hours-${dateStr}`);
            const reasonEl = document.getElementById(`remark-reason-${dateStr}`);

            if (!memberEl || !memberEl.value) return;

            const member = memberEl.value.trim();
            const hours = Number(hoursEl.value || 0.5);
            const reason = reasonEl.value.trim();

            if (!state.records[dateStr]) state.records[dateStr] = { lunch: ["", ""], afterSchool: ["", ""], remarks: [] };
            if (!state.records[dateStr].remarks) state.records[dateStr].remarks = [];
            
            state.records[dateStr].remarks.push({
                id: Date.now().toString(),
                member: member,
                hours: hours,
                reason: reason
            });
            
            saveData(dateStr, state.records[dateStr]).then(() => {
                render();
            });
        }

        window.deleteRemark = function(dateStr, remarkId) {
            if (state.records[dateStr] && state.records[dateStr].remarks) {
                state.records[dateStr].remarks = state.records[dateStr].remarks.filter(r => r.id !== remarkId);
                saveData(dateStr, state.records[dateStr]).then(() => {
                    render();
                });
            }
        }

        // 儲存成員名單 (全方位安全檢查，修復 TypeError 崩潰)
        window.saveMembers = function() {
            const inputs = document.querySelectorAll('.member-input-field');
            const newMembers = [];
            
            inputs.forEach((input, i) => {
                const val = input.value.trim();
                newMembers.push(val || `成員 ${i + 1}`);

            if (newMembers.length > 0) {
                state.members = newMembers;
                saveMembersToCloud();
                closeMembersModal();
                render();

            if (confirm("確定要恢復預設成員名單嗎？")) {

                closeMembersModal();
                render();

        window.openBackupModal = function() {
            document.getElementById('backup-modal').classList.remove('hidden');
        }

        window.closeBackupModal = function() {
            document.getElementById('backup-modal').classList.add('hidden');
        }

        window.exportJSONBackup = function() {
            const backupData = {
                version: "2026.1",
                exportTime: new Date().toISOString(),
                members: state.members,
                records: state.records
            };

            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SU_Duty_Backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        window.importJSONBackup = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.members && data.records) {
                        state.members = data.members;
                        state.records = data.records;
                        saveMembersToCloud();
                        Object.keys(state.records).forEach(d => saveData(d, state.records[d]));
                        alert("備份資料匯入成功！");
                        closeBackupModal();
                        render();
                    } else {
                        alert("備份檔案格式不正確！");
                    }
                } catch(err) {
                    alert("解析 JSON 備份檔失敗！");
                }
            };
            reader.readAsText(file);
        }

        window.onload = function() {
            setTimeout(() => {
                if (!state.isCloudReady) {
                    initLocalStorageFallback();
                }
            }, 2500);
        };
    </script>
</body>
</html>
